<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEO BR - Contato</title>
  <meta name="description" content="Entre em contato conosco.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav>
    <a href="../index.html" class="logo">AEOBR <span>.com.br</span></a>
    <button class="mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">☰</button>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="servicos.html">Serviços</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contato.html" class="active nav-cta">Contato</a></li>
    </ul>
  </nav>

  <section class="page-header">
    <!-- ERRO AEO: H1 ultra-genérico -->
    <h1 class="fade-up">Fale Conosco</h1>
    <p class="fade-up fade-up-delay-1">Estamos prontos para ouvir você.</p>
  </section>

  <!-- FORM -->
  <!-- ERRO AEO: formulário sem informações de contato visíveis (telefone, email, endereço) -->
  <!-- ERRO AEO: sem schema ContactPoint ou LocalBusiness -->
  <section>
    <div class="form-grid">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Telefone</label>
        <input type="tel" placeholder="(11) 99999-9999">
      </div>
      <div class="form-group">
        <label>Empresa</label>
        <input type="text" placeholder="Nome da empresa">
      </div>
      <div class="form-group full-width">
        <label>Assunto</label>
        <select>
          <option>Selecione...</option>
          <option>Quero conhecer os serviços</option>
          <option>Solicitar proposta</option>
          <option>Parceria</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label>Mensagem</label>
        <textarea placeholder="Conte-nos como podemos ajudar..."></textarea>
      </div>
      <div class="form-group full-width" style="text-align: center;">
        <button class="btn-primary" onclick="alert('Formulário de demonstração')">Enviar Mensagem →</button>
      </div>
    </div>
  </section>

  <!-- ERRO AEO: nenhuma informação de contato visível no conteúdo da página -->
  <!-- ERRO AEO: sem mapa, sem endereço, sem horário de funcionamento -->

  <footer>
    <p>&copy; 2026 AEO BR. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
