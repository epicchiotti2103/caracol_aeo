[project]
name = "caracol-aeo-mcp"
version = "1.0.0"
description = "Servidor MCP da Caracol AEO em FastMCP com transporte Streamable HTTP. Tool principal: auditar_site_aeo."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
caracol-aeo-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
